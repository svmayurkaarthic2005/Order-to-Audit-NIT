name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: porulottam
          POSTGRES_PASSWORD: porulottam
          POSTGRES_DB: porulottam
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U porulottam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://porulottam:porulottam@localhost:5432/porulottam
      JWT_SECRET: ci-only-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # The test suite deletes the rows it creates; this throwaway database
      # opts in to that. Production databases never do, so the ledger and
      # activity log stay append-only there.
      - run: echo "ALTER DATABASE porulottam SET app.allow_ledger_cleanup = 'on';" | npx prisma db execute --stdin --schema prisma/schema.prisma
      - run: npm run db:seed
      - run: npx tsc --noEmit
      - run: npm test
      # Section 5 benchmark, replayed on its own brand-new database.
      - run: npm run benchmark

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
