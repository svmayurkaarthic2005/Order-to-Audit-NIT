services:
  - type: web
    name: porulottam-backend
    runtime: node
    rootDir: backend
    # Free tier: the service spins down after 15 minutes idle and the first
    # request after that takes ~30-60s to wake it back up. Fine for grading/
    # demo use; switch to "starter" for an always-on paid instance.
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      # Supabase Postgres (project porulottam-erp, ap-south-1). Use the
      # "Session pooler" connection string from Supabase's Connect panel:
      # Render's free instances have no IPv6, and the direct db.* host is
      # IPv6-only. Session mode (port 5432) also supports prisma migrate.
      # Append ?connection_limit=5&pool_timeout=20: the free pooler allows
      # only a few sessions, and Prisma would otherwise open one per CPU.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Set to the deployed Vercel frontend URL (e.g. https://porulottam.vercel.app) —
      # must match exactly, no trailing slash, since it is echoed back as the
      # CORS Access-Control-Allow-Origin.
      - key: FRONTEND_ORIGIN
        sync: false
      # Supabase Storage for invoice PDFs — leave unset to fall back to local
      # disk storage (fine for a demo, lost on every redeploy).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MANUFACTURER_GSTIN
        sync: false
      # This service's own public URL (e.g. https://porulottam-backend.onrender.com),
      # used in the invoice links sent over WhatsApp.
      - key: PUBLIC_API_URL
        sync: false
      - key: MANUFACTURER_STATE
        value: "Tamil Nadu"
      # Gmail SMTP for the "Email invoice" button — a Gmail App Password, not
      # the account password. Leave unset to disable (returns a 503).
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

