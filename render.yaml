services:
  - type: web
    name: porulottam-backend
    runtime: node
    rootDir: backend
    # Free tier: the service spins down after 15 minutes idle and the first
    # request after that takes ~30-60s to wake it back up. Fine for grading/
    # demo use; switch to "starter" for an always-on paid instance.
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: porulottam-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Set to the deployed Vercel frontend URL (e.g. https://porulottam.vercel.app) —
      # must match exactly, no trailing slash, since it is echoed back as the
      # CORS Access-Control-Allow-Origin.
      - key: FRONTEND_ORIGIN
        sync: false
      # Supabase Storage for invoice PDFs — leave unset to fall back to local
      # disk storage (fine for a demo, lost on every redeploy).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MANUFACTURER_GSTIN
        sync: false
      - key: MANUFACTURER_STATE
        value: "Tamil Nadu"
      # Gmail SMTP for the "Email invoice" button — a Gmail App Password, not
      # the account password. Leave unset to disable (returns a 503).
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

databases:
  - name: porulottam-db
    # Free tier: Render deletes a free Postgres instance 30 days after
    # creation, with no renewal — re-seed on a fresh one (or upgrade to
    # "starter") before then if the deployment needs to outlive that.
    plan: free
    databaseName: porulottam
    user: porulottam
    # No public internet access — only Render's own private network (the
    # backend service above) can reach this database.
    ipAllowList: []
